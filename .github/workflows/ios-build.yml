name: iOS Simulator App

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'ios/**'
      - 'app/src/main/assets/local-sounds/rain-01.ogg'
      - 'app/src/main/assets/local-sounds/rain-04.ogg'
      - 'tools/prepare_ios_audio.py'
      - 'tools/test_prepare_ios_audio.py'
      - 'assets-manifest.csv'
      - '.gitignore'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'app/src/main/assets/local-sounds/rain-01.ogg'
      - 'app/src/main/assets/local-sounds/rain-04.ogg'
      - 'tools/prepare_ios_audio.py'
      - 'tools/test_prepare_ios_audio.py'
      - 'assets-manifest.csv'
      - '.gitignore'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          brew update
          if brew list --versions ffmpeg >/dev/null; then
            brew upgrade ffmpeg
          else
            brew install ffmpeg
          fi

          expected_ffmpeg_version='9.0.2'
          actual_ffmpeg_version="$(ffmpeg -version | awk 'NR == 1 { print $3 }')"
          echo "Using FFmpeg $actual_ffmpeg_version"
          test "$actual_ffmpeg_version" = "$expected_ffmpeg_version"

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Prepare generated iOS audio
        run: |
          set -euo pipefail

          tracked_generated="$(git ls-files -- \
            ios/MinimalSleep/Resources/rain-01.wav \
            ios/MinimalSleep/Resources/rain-04.wav \
            ios/MinimalSleep/Resources/rain-01.m4a \
            ios/MinimalSleep/Resources/rain-04.m4a)"
          test -z "$tracked_generated"

          assert_ignored() {
            git check-ignore -v --no-index "$1" |
              awk -F '\t' '
                BEGIN { found = 0 }
                {
                  found = 1
                  if ($1 ~ /:!/) {
                    exit 1
                  }
                }
                END {
                  if (!found) {
                    exit 1
                  }
                }
              '
          }

          assert_ignored ios/MinimalSleep/Resources/rain-01.wav
          assert_ignored ios/MinimalSleep/Resources/rain-04.wav
          assert_ignored ios/MinimalSleep/Resources/.rain-01.transcoding.wav
          assert_ignored ios/MinimalSleep/Resources/.rain-04.transcoding.wav
          assert_ignored ios/MinimalSleep/Resources/rain-01.m4a
          assert_ignored ios/MinimalSleep/Resources/rain-04.m4a
          assert_ignored ios/MinimalSleep/Resources/.rain-01.transcoding.m4a
          assert_ignored ios/MinimalSleep/Resources/.rain-04.transcoding.m4a

          python -m unittest discover -s tools -p 'test_prepare_ios_audio.py' -v
          python tools/prepare_ios_audio.py --ffmpeg "$(command -v ffmpeg)"

          test -s ios/MinimalSleep/Resources/rain-01.m4a
          test -s ios/MinimalSleep/Resources/rain-04.m4a
          test ! -e ios/MinimalSleep/Resources/rain-01.wav
          test ! -e ios/MinimalSleep/Resources/rain-04.wav

          git diff --exit-code -- \
            assets-manifest.csv \
            ios/MinimalSleep/Resources/audio-derivations.json

      - name: Select an available iPhone simulator
        run: |
          simulator_udid="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )["devices"]

          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)

          raise SystemExit("No available iPhone simulator was found")
          PY
          )"
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "Using iPhone simulator $simulator_udid"

      - name: Run iOS tests
        run: |
          set +e
          xcodebuild \
            -project ios/MinimalSleep.xcodeproj \
            -scheme MinimalSleep \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/ios-tests" \
            CODE_SIGNING_ALLOWED=NO \
            test > ios-tests.log 2>&1
          result=$?
          cat ios-tests.log
          if [ "$result" -ne 0 ]; then
            {
              echo '### iOS tests failed (last 100 log lines)'
              echo '```text'
              tail -n 100 ios-tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Build unsigned simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/MinimalSleep.xcodeproj \
            -scheme MinimalSleep \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee ios-release-build.log

      - name: Verify and package simulator app
        run: |
          app="$RUNNER_TEMP/ios-release/Build/Products/Release-iphonesimulator/MinimalSleep.app"
          test -d "$app"
          test -s "$app/MinimalSleep"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = '0.5.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = '2'
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist")"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$app/Info.plist" | grep -q audio
          test -s "$app/rain-01.m4a"
          test -s "$app/rain-04.m4a"
          test ! -e "$app/rain-01.wav"
          test ! -e "$app/rain-04.wav"
          test -s "$app/heavy_rain.wav"
          test -s "$app/ocean_waves.wav"
          test -s "$app/white_noise.wav"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/MinimalSleep-iOS-Simulator.zip
          (
            cd dist
            shasum -a 256 MinimalSleep-iOS-Simulator.zip > MinimalSleep-iOS-Simulator.zip.sha256
            shasum -a 256 -c MinimalSleep-iOS-Simulator.zip.sha256
          )
          cat dist/MinimalSleep-iOS-Simulator.zip.sha256

      - name: Upload simulator app
        id: ios_app
        uses: actions/upload-artifact@v7
        with:
          name: minimal-sleep-ios-simulator-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Show download link
        run: |
          echo "[Download iOS simulator artifact](${{ steps.ios_app.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact contains an unsigned simulator app ZIP and its SHA-256 file.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It runs only in an iOS Simulator and cannot be installed on an iPhone.' >> "$GITHUB_STEP_SUMMARY"
